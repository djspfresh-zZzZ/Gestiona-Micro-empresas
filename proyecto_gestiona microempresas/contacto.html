<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto - Mensajito</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Baloo+2:wght@600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ffe4ec,#ffc2d1);font-family:'Poppins',sans-serif;padding:20px;box-sizing:border-box}
  .card{background:white;width:100%;max-width:500px;padding:32px;border-radius:26px;box-shadow:0 15px 35px rgba(255,93,143,0.2);border:2px solid #ffe4ec}
  .volver{display:inline-block;color:#ff8fab;text-decoration:none;font-size:13px;margin-bottom:12px;font-weight:500}
  .volver:hover{color:#ff5d8f}
  h2{font-family:'Baloo 2',cursive;color:#ff5d8f;text-align:center;margin:0 0 20px;font-size:28px}
  label{display:block;color:#ff5d8f;font-weight:500;font-size:14px;margin:14px 0 6px}
  input,select,textarea{width:100%;padding:13px 16px;border-radius:14px;border:2px solid #ffb3c6;background:#fff0f3;outline:none;font-family:'Poppins',sans-serif;font-size:14px;box-sizing:border-box;transition:0.3s}
  input:focus,select:focus,textarea:focus{border-color:#ff5d8f;background:white;box-shadow:0 0 0 4px rgba(255,93,143,0.15)}
  textarea{height:110px;resize:none}
  .check{display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:12px;color:#8a4a5a}
  .check input{width:auto;margin-top:3px}
  .btn-rosa{width:100%;margin-top:20px;padding:14px;background:linear-gradient(90deg,#ff5d8f,#ff8fab);color:white;border:none;border-radius:14px;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 6px 15px rgba(255,93,143,0.3);transition:0.3s}
  .btn-rosa:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(255,93,143,0.4)}
</style>
</head>
<body>
  <form class="card" onsubmit="event.preventDefault(); alert('¡Mensaje enviado con éxito! 💖'); this.reset();">
    <a href="index.html" class="volver">← Volver al inicio</a>
    <h2>Escríbenos un mensajito 💌</h2>
    <label>Nombre completo 👧🏻</label>
    <input type="text" placeholder="Ej. Sofi García" required>
    <label>Correo electrónico 💌</label>
    <input type="email" placeholder="sofi@ejemplo.com" required>
    <label>Asunto 🎀</label>
    <select required><option value="">Elige...</option><option>Consulta</option><option>Cita</option><option>Otro</option></select>
    <label>Tu mensaje 💭</label>
    <textarea placeholder="Cuéntanos..." required></textarea>
    <label class="check"><input type="checkbox" required> Acepto que me contacten 💖</label>
    <button type="submit" class="btn-rosa">Enviar mensaje 💖</button>
  </form>
</body>
</html>
